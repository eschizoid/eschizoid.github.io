<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="The loop: bd ready feeds the agent, the agent opens a pull request, the gate passes, fleet-merge converges and merges, the node closes, and the next node becomes ready.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9375fd"/>
    </marker>
  </defs>
  <g fill="none" stroke="#8a8f98" stroke-width="1.5">
    <rect x="40"  y="40"  width="170" height="50" rx="8"/>
    <rect x="300" y="40"  width="250" height="50" rx="8"/>
    <rect x="640" y="40"  width="220" height="50" rx="8"/>
    <rect x="640" y="190" width="220" height="50" rx="8"/>
    <rect x="300" y="190" width="250" height="50" rx="8"/>
    <rect x="40"  y="190" width="170" height="50" rx="8"/>
  </g>
  <g stroke="#9375fd" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="210" y1="65"  x2="292" y2="65"/>
    <line x1="550" y1="65"  x2="632" y2="65"/>
    <line x1="750" y1="90"  x2="750" y2="182"/>
    <line x1="640" y1="215" x2="558" y2="215"/>
    <line x1="300" y1="215" x2="218" y2="215"/>
    <line x1="125" y1="190" x2="125" y2="98"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8a8f98" text-anchor="middle">
    <text x="125" y="70">bd ready</text>
    <text x="425" y="70">agent implements the node</text>
    <text x="750" y="70">opens a pull request</text>
    <text x="750" y="220">the gate passes</text>
    <text x="425" y="220">fleet-merge converges + merges</text>
    <text x="125" y="220">node closes</text>
  </g>
</svg>
